name: meeting-workbench
services:
  db:
    build:
      context: .
      dockerfile: docker/mysql.Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: 会议纪要管理
      MYSQL_USER: meeting
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/configure-docker.mjs first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/configure-docker.mjs first}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u meeting -e "SELECT 1" "会议纪要管理" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  web:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ALLOWED_HOST: db
      MEETING_LAN_HOST: ${MEETING_LAN_HOST:-localhost}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-管理员}
    ports:
      - "${MEETING_LISTEN_IP:-127.0.0.1}:${MEETING_HTTP_PORT:-8765}:8765"
    volumes:
      - meeting-data:/app/data
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8765/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  funasr:
    profiles: [speech]
    build:
      context: .
      dockerfile: services/funasr/Dockerfile
    restart: unless-stopped
    environment:
      MODELSCOPE_CACHE: /models
      FUNASR_DEVICE: cpu
      FUNASR_CPU_THREADS: ${FUNASR_CPU_THREADS:-2}
    volumes:
      - speech-models:/models
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10097/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30m
volumes:
  mysql-data:
  meeting-data:
  speech-models:
