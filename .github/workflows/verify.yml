name: Verify native deployment
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MEETING_DEPLOY_VERIFY: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full Windows deployment including four models
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/deploy.ps1
      - name: Full macOS deployment including four models
        if: runner.os == 'macOS'
        run: bash scripts/deploy.sh
      - name: Application and isolated native database tests
        shell: bash
        run: |
          export MYSQLD_TEST_PATH="$(node -e 'const fs=require("fs");console.log(JSON.parse(fs.readFileSync(".runtime/native-tools.json","utf8").replace(/^\uFEFF/,"")).mysqld)')"
          npm test
      - name: Restart without reinstalling dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/deploy.ps1 -StartOnly
      - name: Restart without reinstalling dependencies
        if: runner.os == 'macOS'
        run: bash scripts/deploy.sh --start
      - name: Service diagnostics
        if: failure()
        shell: bash
        run: tail -n 80 logs/native-*.log || true
